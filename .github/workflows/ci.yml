name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.mjs
          node --check free-pi-core.mjs
          node --check tests/smoke.mjs
      - name: Smoke tests (hermetic — upstream calls are stubbed)
        run: node tests/smoke.mjs
